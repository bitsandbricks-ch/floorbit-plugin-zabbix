name: Test and release

# Tests every push and pull request against Floorbit at the commit in
# FLOORBIT_REF. A pushed tag v<version> that matches plugin.yaml is also
# signed and released:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The release is <id>-<version>.tar.gz, signed with the Floorbit plugin key.
# Floorbit installs it from the Marketplace (bitsandbricks-ch/floorbit-plugins
# picks it up within the hour, or at once with MARKETPLACE_TOKEN), and the
# local agents take the same file.
#
# The plugin key is the most sensitive secret here: whatever it signs installs
# as "official" on every Floorbit and every agent. Only the sign job sees it,
# as the environment secret FLOORBIT_PLUGIN_SIGNING_KEY of "plugin-signing"
# (not an organisation or repository secret, which every job could read), and
# that job runs no third-party action and no npm, only the plugin from git and
# Floorbit's own tools at FLOORBIT_REF.
#   MARKETPLACE_TOKEN    optional: may send a repository_dispatch to
#                        floorbit-plugins, so the index updates at once
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.meta.outputs.id }}
      version: ${{ steps.meta.outputs.version }}
      floorbit: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - id: ref
        run: echo "sha=$(tr -d '[:space:]' < plugin/FLOORBIT_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitsandbricks-ch/floorbit
          ref: ${{ steps.ref.outputs.sha }}
          path: floorbit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r floorbit/requirements.txt pytest ruff
      # Floorbit is a dependency here; its own config would sort it as first-party.
      - run: ruff check --config floorbit/pyproject.toml --config 'lint.isort.known-third-party=["floorbit"]' plugin
      - name: Tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/floorbit
        run: python -m pytest -q tests
      - id: meta
        name: Id and version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, yaml
          m = yaml.safe_load(open("plugin/plugin.yaml"))
          tag = os.environ["TAG"]
          if tag and tag != f"v{m['version']}":
              sys.exit(f"the tag {tag} doesn't match plugin.yaml's version {m['version']}")
          print(f"id={m['id']}")
          print(f"version={m['version']}")
          PY

  sign:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: plugin-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitsandbricks-ch/floorbit
          ref: ${{ needs.test.outputs.floorbit }}
          path: floorbit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r floorbit/requirements.txt
      - name: Sign and pack
        env:
          SIGNING_KEY: ${{ secrets.FLOORBIT_PLUGIN_SIGNING_KEY }}
          VER: ${{ needs.test.outputs.version }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::add FLOORBIT_PLUGIN_SIGNING_KEY to the plugin-signing environment"; exit 1; fi
          key="$RUNNER_TEMP/key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          # What's committed, nothing else.
          mkdir -p "$RUNNER_TEMP/src" && git -C plugin archive HEAD | tar -x -C "$RUNNER_TEMP/src"
          python floorbit/scripts/marketplace.py sign "$RUNNER_TEMP/src" --key "$key" --version "$VER" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          retention-days: 1

  release:
    needs: [test, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VER: ${{ needs.test.outputs.version }}
        run: |
          # The notes are the version's section of CHANGELOG.md.
          awk -v v="## $VER" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$VER" --notes-file notes.md
      - name: Tell the Marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        # Without the token the hourly run picks the release up.
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          gh api repos/bitsandbricks-ch/floorbit-plugins/dispatches -f event_type=plugin-released
