# The manifest. Floorbit reads it before it runs any code: what the plugin may touch (uses), its
# settings, and what the agent part may send. Field by field: Floorbit's docs/plugins.md.
id: example                    # rename: lowercase letters, digits, dashes; the repo is floorbit-plugin-<id>
name: Example reachability
icon: network
version: "0.1.0"
floorbit: ">=0.1,<2"
description: "The local agent checks that a few services in the hall answer on their TCP port and the dashboard shows how many do."
author: Floorbit
homepage: https://github.com/bitsandbricks-ch/floorbit-plugin-template
uses: [agent, settings, widgets, storage]
settings:
  - {key: targets, label: Services, type: text, placeholder: "dns = 192.0.2.53:53\ncache = 192.0.2.80:80",
     help: "One per line: a name = address:port. The agent tries to open a TCP connection to each."}
  - {key: interval, label: Seconds between checks, type: int, default: 30, min: 5, max: 600}
widgets:
  - {id: summary, label: Services up, size: small, refresh: 30}
agent:
  sends:
    # aggregate: counts only. Floorbit and the agent both refuse a payload with an address in it.
    status: {privacy: aggregate, latest: true}
